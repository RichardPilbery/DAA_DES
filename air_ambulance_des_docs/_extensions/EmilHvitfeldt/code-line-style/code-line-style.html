<script type="text/javascript">
(function () {
  // ---------------------------------------------------------------------------
  // Preset registry. name -> CSS class.
  // ---------------------------------------------------------------------------
  // Preset entries can be either a string (CSS class) or
  // { cls, presence } when the style implies a presence animation.
  const PRESETS = {
    diff: {
      add:  { cls: "cs-add",  presence: "enter" },
      rem:  { cls: "cs-rem",  presence: "exit"  },
      chg:  "cs-chg",
      note: "cs-note"
    },
    emphasis: {
      focus:  "cs-focus",
      dim:    "cs-dim",
      strong: "cs-strong",
      mark:   "cs-mark",
      hi:     "cs-hi"
    }
  };

  // Inline style primitives. name -> CSS property name (or special handler).
  const PRIMITIVES = {
    bg:       "background-color",
    fg:       "color",
    gutter:   "border-left-color",
    opacity:  "opacity",
    weight:   "font-weight",
    italic:   (v) => v ? { "font-style": "italic" } : {},
    outline:  "outline",
    marker:   (v) => ({ "--cs-marker": '"' + String(v).replace(/"/g, '\\"') + '"' }),
    duration: (v) => ({ "--cs-duration": (typeof v === "number" ? v + "ms" : String(v)) }),
    easing:   (v) => ({ "--cs-easing": String(v) }),
    class:    null
  };

  function expandInlineStyle(def) {
    // def is e.g. { bg: "#fff", gutter: "#c00", weight: "bold" }
    // Returns { props: {cssProp -> value}, classes: [extra class names] }
    const props = {};
    const classes = [];
    for (const [key, val] of Object.entries(def || {})) {
      if (key === "class") {
        if (Array.isArray(val)) classes.push(...val);
        else classes.push(String(val));
        continue;
      }
      // `fg` needs help reaching nested syntax-token spans, which set their
      // own `color`. Tag the line with `cs-fg` so a descendant rule can force
      // them to inherit the wrapper's color (see code-line-style.css).
      if (key === "fg") {
        props["color"] = String(val);
        classes.push("cs-fg");
        continue;
      }
      const handler = PRIMITIVES[key];
      if (handler == null) {
        console.warn("[code-line-style] unknown primitive:", key);
        continue;
      }
      if (typeof handler === "function") {
        Object.assign(props, handler(val));
      } else {
        props[handler] = String(val);
      }
    }
    return { props, classes };
  }

  // Build a resolver bound to (preset list, inline styles map).
  function makeResolver(presetNames, inlineStyles) {
    return function resolve(name) {
      if (inlineStyles && inlineStyles[name]) {
        const def = inlineStyles[name];
        return { type: "inline", def, presence: def.presence || null };
      }
      for (const p of presetNames) {
        const preset = PRESETS[p];
        if (!preset || !preset[name]) continue;
        const v = preset[name];
        if (typeof v === "string") return { type: "class", cls: v, presence: null };
        return { type: "class", cls: v.cls, presence: v.presence || null };
      }
      return null;
    };
  }

  // ---------------------------------------------------------------------------
  // Parsing
  // ---------------------------------------------------------------------------
  function parseStep(payload) {
    const out = [];
    if (!payload) return out;
    for (const seg of payload.split(",")) {
      const s = seg.trim();
      if (!s) continue;
      const m = s.match(/^([a-zA-Z][\w-]*):(\d+)(?:-(\d+))?$/);
      if (!m) { reportError("cannot parse segment: " + s); continue; }
      const name = m[1];
      const from = parseInt(m[2], 10);
      const to = m[3] ? parseInt(m[3], 10) : from;
      out.push({ name, from, to });
    }
    return out;
  }

  function parseRange(val) {
    // Object form: { line: N, label?: "..." }
    if (val && typeof val === "object" && !Array.isArray(val)) {
      if (val.line == null) { reportError("region object missing `line`"); return null; }
      const line = parseInt(val.line, 10);
      const label = val.label != null ? String(val.label) : null;
      return { from: line, to: line, label };
    }
    const s = String(val).trim();
    const m = s.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) { reportError("cannot parse range: " + s); return null; }
    return { from: parseInt(m[1], 10), to: m[2] ? parseInt(m[2], 10) : parseInt(m[1], 10), label: null };
  }

  // A step is { entries: [...], transition: {...}|null }.
  function parseYamlStep(item) {
    const entries = [];
    let transition = null;
    if (item == null || typeof item !== "object") return { entries, transition };
    if (item.name && item.at != null) {
      const ranges = Array.isArray(item.at) ? item.at : [item.at];
      for (const r of ranges) {
        const range = parseRange(r);
        if (range) entries.push({ name: item.name, ...range });
      }
      if (item.transition) transition = item.transition;
      return { entries, transition };
    }
    for (const [name, val] of Object.entries(item)) {
      if (name === "transition") { transition = val; continue; }
      const ranges = Array.isArray(val) ? val : [val];
      for (const r of ranges) {
        const range = parseRange(r);
        if (range) entries.push({ name, ...range });
      }
    }
    return { entries, transition };
  }

  // Compact-string step: no per-step transition.
  function parseStringStep(payload) {
    return { entries: parseStep(payload), transition: null };
  }

  // parseSpec → { steps, inlineStyles, presets, transition }
  function parseSpec(spec) {
    const empty = { steps: [], inlineStyles: {}, presets: null, transition: null };
    if (!spec) return empty;
    const trimmed = spec.trim();
    if (trimmed.startsWith("[") || trimmed.startsWith("{")) {
      try {
        const parsed = JSON.parse(trimmed);
        if (Array.isArray(parsed)) {
          return { ...empty, steps: parsed.map(parseYamlStep), transition: null };
        }
        const inlineStyles = parsed.styles || {};
        const presetRaw = parsed.preset;
        const presets = presetRaw == null ? null
          : Array.isArray(presetRaw) ? presetRaw
          : [presetRaw];
        const transition = parsed.transition || null;
        const stepsRaw = parsed.steps || parsed.items;
        if (Array.isArray(stepsRaw)) {
          return { steps: stepsRaw.map(parseYamlStep), inlineStyles, presets, transition };
        }
        const { styles, preset, transition: _t, ...rest } = parsed;
        return { steps: [parseYamlStep(rest)], inlineStyles, presets, transition };
      } catch (e) {
        reportError("invalid JSON spec: " + e.message);
        return empty;
      }
    }
    return { ...empty, steps: trimmed.split("|").map(parseStringStep) };
  }

  const MODE_CLASSES = ["cs-mode-none", "cs-mode-fade", "cs-mode-slide", "cs-mode-wipe", "cs-mode-morph"];

  function applyTransition(el, transition) {
    if (!transition) return;
    if (transition.duration != null) {
      const v = typeof transition.duration === "number"
        ? transition.duration + "ms"
        : String(transition.duration);
      el.style.setProperty("--cs-duration", v);
    }
    if (transition.easing) {
      el.style.setProperty("--cs-easing", String(transition.easing));
    }
    if (transition.mode) {
      el.classList.remove(...MODE_CLASSES);
      el.classList.add("cs-mode-" + transition.mode);
    }
  }

  // ---------------------------------------------------------------------------
  // Error reporting
  // ---------------------------------------------------------------------------
  let currentBlock = null;
  let debugMode = false;

  function isDebug() {
    if (debugMode) return true;
    return /[?&]cls-debug=1\b/.test(window.location.search);
  }

  function reportError(msg) {
    console.warn("[code-line-style] " + msg);
    if (isDebug() && currentBlock) {
      let banner = currentBlock.previousElementSibling;
      if (!banner || !banner.classList || !banner.classList.contains("cs-error")) {
        banner = document.createElement("div");
        banner.className = "cs-error";
        banner.style.cssText =
          "background:#ffe4e1;color:#a00;border:1px solid #f88;padding:4px 8px;" +
          "font-family:monospace;font-size:0.8em;margin-bottom:4px;border-radius:3px;";
        currentBlock.parentElement.insertBefore(banner, currentBlock);
      }
      banner.appendChild(document.createTextNode("[code-line-style] " + msg));
      banner.appendChild(document.createElement("br"));
    }
  }

  // ---------------------------------------------------------------------------
  // DOM helpers
  // ---------------------------------------------------------------------------
  function getLineEls(codeEl) {
    return Array.from(codeEl.querySelectorAll(":scope > span[id]"));
  }

  // Attach a label rendered to the right margin, anchored to `el`. The label
  // node is appended to the nearest `div.sourceCode` and positioned absolutely
  // based on `el`'s bounding box. The label is announced via the live region.
  function positionLabel(label, anchor, container) {
    const cRect = container.getBoundingClientRect();
    const eRect = anchor.getBoundingClientRect();
    // Use offsets relative to the container's own coordinate system so reveal's
    // CSS transform (slide scaling) doesn't distort the math.
    const scaleY = cRect.height && container.offsetHeight ? container.offsetHeight / cRect.height : 1;
    const scaleX = cRect.width && container.offsetWidth ? container.offsetWidth / cRect.width : 1;
    const top = (eRect.top - cRect.top) * scaleY + (eRect.height * scaleY) / 2 - label.offsetHeight / 2;
    const left = container.offsetWidth + 24;
    label.style.top = top + "px";
    label.style.left = left + "px";
  }

  const positionedLabels = new Set();

  function attachLabel(el, text) {
    const container = el.closest("div.sourceCode");
    if (!container) return;
    const label = document.createElement("span");
    label.className = "cs-label";
    label.textContent = text;
    label._csAnchor = el;
    label._csContainer = container;
    container.appendChild(label);
    positionedLabels.add(label);
    requestAnimationFrame(() => positionLabel(label, el, container));
    announce(text);
  }

  function repositionAllLabels() {
    for (const label of positionedLabels) {
      if (!label.isConnected) { positionedLabels.delete(label); continue; }
      positionLabel(label, label._csAnchor, label._csContainer);
    }
  }

  window.addEventListener("resize", repositionAllLabels);
  if (window.Reveal) {
    const rl = () => requestAnimationFrame(repositionAllLabels);
    window.Reveal.on("slidechanged", rl);
    window.Reveal.on("resize", rl);
    window.Reveal.on("ready", rl);
  }

  function clearLabels(container) {
    container.querySelectorAll(":scope > .cs-label").forEach((n) => {
      positionedLabels.delete(n);
      n.remove();
    });
  }

  let liveRegion = null;
  function announce(text) {
    if (!liveRegion) {
      liveRegion = document.createElement("div");
      liveRegion.className = "cs-live";
      liveRegion.setAttribute("aria-live", "polite");
      liveRegion.setAttribute("aria-atomic", "true");
      document.body.appendChild(liveRegion);
    }
    liveRegion.textContent = text;
  }

  // Apply an array of entries against the given line elements using resolve().
  // Returns the set of (CSS class, prop-name) records touched so we can clear
  // them later for progressive replace semantics.
  function applyEntries(lines, entries, resolve) {
    const touchedClasses = new Set();
    const touchedProps = new Set();
    // Per-element accumulator for inline props — later entries win on conflicts.
    const elementProps = new Map();

    for (const entry of entries) {
      const { name, from, to, label } = entry;
      const resolved = resolve(name);
      if (!resolved) { reportError("unknown style name: " + name); continue; }

      for (let i = from; i <= to; i++) {
        const lineEl = lines[i - 1];
        if (!lineEl) { reportError("line out of range: " + i); continue; }

        const targets = [lineEl];
        if (label) attachLabel(lineEl, label);

        for (const el of targets) {
          if (resolved.type === "class") {
            el.classList.add(resolved.cls);
            touchedClasses.add(resolved.cls);
          } else {
            const { props, classes } = expandInlineStyle(resolved.def);
            for (const c of classes) {
              el.classList.add(c);
              touchedClasses.add(c);
            }
            const existing = elementProps.get(el) || {};
            Object.assign(existing, props);
            elementProps.set(el, existing);
            for (const k of Object.keys(props)) touchedProps.add(k);
          }
          if (resolved.presence === "exit" || resolved.presence === "enter") {
            // `cs-presence-enter` is the steady "open" state and provides the
            // target value for transitions in both directions. It stays on the
            // element across step transitions (see clearAll).
            el.classList.add("cs-presence-enter");
          }
          if (resolved.presence === "exit") {
            el.classList.add("cs-presence-exit");
            touchedClasses.add("cs-presence-exit");
          } else if (resolved.presence === "enter") {
            el.classList.add("cs-presence-hidden");
            touchedClasses.add("cs-presence-hidden");
            requestAnimationFrame(() => {
              requestAnimationFrame(() => el.classList.remove("cs-presence-hidden"));
            });
          }
        }
      }
    }

    for (const [el, props] of elementProps) {
      for (const [k, v] of Object.entries(props)) {
        el.style.setProperty(k, v);
      }
    }

    return { classes: [...touchedClasses], props: [...touchedProps] };
  }

  function clearAll(lines, touched, container) {
    for (const el of lines) {
      if (touched.classes.length) el.classList.remove(...touched.classes);
      for (const p of touched.props) el.style.removeProperty(p);
    }
    if (container) clearLabels(container);
  }

  // ---------------------------------------------------------------------------
  // Application
  // ---------------------------------------------------------------------------
  function applyStatic(codeEl, step, resolve) {
    const lines = getLineEls(codeEl);
    if (step.transition) {
      for (const line of lines) applyTransition(line, step.transition);
    }
    applyEntries(lines, step.entries, resolve);
  }

  function applyProgressive(preEl, codeEl, steps, resolve) {
    const lines = getLineEls(codeEl);

    const allTouched = { classes: new Set(), props: new Set() };
    // Lines touched by any presence style. They get a permanent
    // `cs-presence-enter` so the transition rule stays active in both
    // directions; `cs-presence-exit` / `cs-presence-hidden` toggle on top.
    const presenceLines = new Set();

    for (const step of steps) {
      for (const { name, from, to } of step.entries) {
        const r = resolve(name);
        if (!r) continue;
        if (r.type === "class") allTouched.classes.add(r.cls);
        else {
          const { props, classes } = expandInlineStyle(r.def);
          for (const c of classes) allTouched.classes.add(c);
          for (const k of Object.keys(props)) allTouched.props.add(k);
        }
        if (r.presence === "exit") {
          allTouched.classes.add("cs-presence-exit");
          for (let i = from; i <= to; i++) presenceLines.add(i - 1);
        } else if (r.presence === "enter") {
          allTouched.classes.add("cs-presence-hidden");
          for (let i = from; i <= to; i++) presenceLines.add(i - 1);
        }
      }
    }

    // Seed `cs-presence-enter` once on every presence-affected line; do NOT
    // clear it between steps — it's the steady-state open marker.
    for (const idx of presenceLines) {
      if (lines[idx]) lines[idx].classList.add("cs-presence-enter");
    }
    const totalTouched = { classes: [...allTouched.classes], props: [...allTouched.props] };

    const container = codeEl.closest("div.sourceCode");
    const applyStep = (idx) => {
      clearAll(lines, totalTouched, container);
      const step = steps[idx];
      if (!step) return;
      if (step.transition) {
        for (const line of lines) applyTransition(line, step.transition);
      }
      applyEntries(lines, step.entries, resolve);
    };

    applyStep(0);

    for (let i = 1; i < steps.length; i++) {
      const frag = document.createElement("span");
      frag.className = "fragment cs-step";
      frag.setAttribute("data-cs-step", String(i));
      frag.style.display = "none";
      preEl.appendChild(frag);
    }

    if (window.Reveal) {
      const handler = (e) => {
        if (!preEl.contains(e.fragment)) return;
        const idx = parseInt(e.fragment.getAttribute("data-cs-step") || "0", 10);
        if (e.type === "fragmentshown") applyStep(idx);
        if (e.type === "fragmenthidden") applyStep(idx - 1);
      };
      window.Reveal.on("fragmentshown", handler);
      window.Reveal.on("fragmenthidden", handler);
    }
  }

  // ---------------------------------------------------------------------------
  // Entry point
  // ---------------------------------------------------------------------------
  // Read an attribute that may appear with or without the `data-` prefix —
  // Pandoc auto-prefixes custom code-block attributes when emitting HTML, but
  // users may also author the prefixed form directly.
  function readAttr(preEl, name) {
    const wrapper =
      preEl.closest("[" + name + "], [data-" + name + "]") || preEl;
    return wrapper.getAttribute(name) || wrapper.getAttribute("data-" + name);
  }

  function getSpec(preEl) {
    const spec = readAttr(preEl, "code-line-style");
    if (spec) return spec;
    const legacy = readAttr(preEl, "code-line-diff");
    if (legacy) {
      reportError("code-line-diff is deprecated, use code-line-style");
      return legacy.replace(/([+\-!#@]):/g, (_, m) => {
        return { "+": "add:", "-": "rem:", "!": "chg:", "#": "note:", "@": "hi:" }[m];
      });
    }
    return null;
  }

  function getPresets(preEl) {
    const raw = readAttr(preEl, "code-line-style-preset");
    if (!raw) return ["diff", "emphasis"];
    return raw.split(/[,\s]+/).filter(Boolean);
  }

  function getStaticMode(preEl) {
    const raw = readAttr(preEl, "code-line-style-static");
    return raw === "merged" ? "merged" : "last";
  }

  function process() {
    const blocks = document.querySelectorAll("pre > code, div.sourceCode pre > code");
    blocks.forEach((codeEl) => {
      const preEl = codeEl.parentElement;
      currentBlock = preEl.closest("div.sourceCode") || preEl;
      const spec = getSpec(preEl);
      if (!spec) { currentBlock = null; return; }
      const { steps, inlineStyles, presets, transition } = parseSpec(spec);
      if (steps.length === 0) { currentBlock = null; return; }
      const presetNames = presets || getPresets(preEl);
      const resolve = makeResolver(presetNames, inlineStyles);
      if (transition) {
        const codeEl2 = codeEl;
        for (const line of getLineEls(codeEl2)) applyTransition(line, transition);
      }

      if (steps.length === 1) {
        applyStatic(codeEl, steps[0], resolve);
      } else if (window.Reveal) {
        applyProgressive(preEl, codeEl, steps, resolve);
      } else {
        // No Reveal → no fragments. Pick a static collapse strategy.
        const mode = getStaticMode(preEl);
        if (mode === "merged") {
          const merged = { entries: steps.flatMap(s => s.entries), transition: null };
          applyStatic(codeEl, merged, resolve);
        } else {
          applyStatic(codeEl, steps[steps.length - 1], resolve);
        }
      }
      currentBlock = null;
    });
  }

  if (window.Reveal) {
    if (window.Reveal.isReady && window.Reveal.isReady()) process();
    else window.Reveal.on("ready", process);
  } else {
    document.addEventListener("DOMContentLoaded", process);
  }
})();
</script>
