docs_dir: air_ambulance_des_docs     # relative to the target repo (C:/DAAT/DAA_DES)
project_type: website
section_dir: tutorial
git_tracked: true                    # _quarto.yml is tracked and unmodified relative to HEAD (tutorial wiring is committed)
existing_tutorial: true

navigation:
  pattern: multi-sidebar             # website.sidebar in _quarto.yml is a LIST (four tutorial items) merged with the _sidebar.yml list via metadata-files
  details: |
    Refresh mode: section folder is not a blocker. The tutorial is already wired into _quarto.yml as a four-audience tutorial
    (intermediate, advanced-contributor, stakeholder-decision-maker, stakeholder-domain-expert).
    website.navbar.left has Home, Reference and a "Tutorial" dropdown menu (lines 21-30) with four entries.
    website.sidebar (line 31) is a list in _quarto.yml itself (lines 32-82) holding four items, ids tutorial-intermediate,
    tutorial-advanced-contributor, tutorial-stakeholder-decision-maker, tutorial-stakeholder-domain-expert (all style: docked).
    The "reference" and other sidebars come from the quartodoc-generated _sidebar.yml (git-ignored) via top-level
    metadata-files (lines 84-86). Do not edit _sidebar.yml or quartodoc.sidebar.
    The tutorial sidebars are in _quarto.yml, not in a metadata file.
    tutorial/index.qmd still exists on disk but is NOT referenced from navigation (the menu points at each audience's index.qmd).
    Audience folders: intermediate/ and advanced-contributor/ hold 10 files each (index, 01-08, glossary); stakeholder-decision-maker/
    holds 8 (index, what-it-does, how-it-works, assumptions-limits, risks, keeping-it-running, questions-to-ask, glossary);
    stakeholder-domain-expert/ holds 7 (index, what-it-does, how-it-works, how-decisions-are-made, reading-results, assumptions-limits, glossary).
    The sidebar lists match the files on disk.
    Links into tutorial/ from OUTSIDE the section (Grep over the repo excluding tutorial/, reference/, _extensions/, docs_quarto/):
    none in hand-written pages; only the _quarto.yml lines quoted below.
    Other facts: project.output-dir is ../docs_quarto; pre-render script sync_docs.py regenerates readme.qmd, licence.qmd,
    code_of_conduct.qmd, STARS.qmd, STRESS_DES.qmd (all git-ignored) and never touches tutorial/.
    _quarto.yml.pre-tutorial.bak exists in the docs dir (untouched). tutorial/ also holds _backup-pre-add-audience/, _styles/, _work/ and
    top-level _evidence.yaml, _generation.json, _outline.yaml, _plain-outline.yaml, _site-profile.yaml.
  tutorial_entries:
    - kind: navbar item (dropdown menu "Tutorial") in website.navbar.left
      lines: "21-30"
      text: |
        21:      - text: Tutorial
        22:        menu:
        23:          - text: Intermediate
        24:            href: tutorial/intermediate/index.qmd
        25:          - text: Contributor
        26:            href: tutorial/advanced-contributor/index.qmd
        27:          - text: Decision-makers
        28:            href: tutorial/stakeholder-decision-maker/index.qmd
        29:          - text: Domain experts
        30:            href: tutorial/stakeholder-domain-expert/index.qmd
    - kind: sidebar (id tutorial-intermediate), in _quarto.yml itself
      lines: "32-45"
      text: |
        32:    - id: tutorial-intermediate
        33:      title: Tutorial (Intermediate)
        34:      style: docked
        35:      contents:
        36:        - tutorial/intermediate/index.qmd
        37:        - tutorial/intermediate/01_streamlit_app_and_scenario_parameters.qmd
        38:        - tutorial/intermediate/02_simulation_runs_and_replications.qmd
        39:        - tutorial/intermediate/03_sampling_distributions_and_random_streams.qmd
        40:        - tutorial/intermediate/04_calls_and_patient_journeys.qmd
        41:        - tutorial/intermediate/05_hems_resources_and_servicing.qmd
        42:        - tutorial/intermediate/06_resource_allocation.qmd
        43:        - tutorial/intermediate/07_trial_results_and_historic_comparison.qmd
        44:        - tutorial/intermediate/08_distribution_fitting.qmd
        45:        - tutorial/intermediate/glossary.qmd
    - kind: sidebar (id tutorial-advanced-contributor), in _quarto.yml itself
      lines: "46-59"
