tools:
  quarto: "1.11.0"
  quartodoc_installed: true          # importable (it has no __version__ attribute)

filters: [include-code-files, code-window, code-line-style, value-box]

extensions_present:
  - {name: quarto-ext/include-code-files, version: 1.0.0, contributes: [filters], enabled: true}
  - {name: mcanouil/code-window, version: 1.6.0, contributes: [filters], enabled: true}   # requires quarto >=1.9.36; 1.11.0 installed
  - {name: EmilHvitfeldt/code-line-style, version: 0.1.0, contributes: [filters], enabled: true}
  - {name: bergam0t/value-box, version: 2.0.0, contributes: [filters], enabled: true}
