docs_dir: air_ambulance_des_docs     # relative to the target repo (C:/DAAT/DAA_DES)
project_type: website
section_dir: tutorial
git_tracked: true                    # _quarto.yml is tracked (it has uncommitted modifications: " M" in git status, the user's filters block)

navigation:
  pattern: navbar-only               # no navbar and no website.sidebar in _quarto.yml; the only sidebar comes from _sidebar.yml. Use the multi-sidebar recipe.
  details: |
    No section-folder blocker: air_ambulance_des_docs/tutorial/ exists but is empty (only _work, created by this survey).
    _quarto.yml has NO website.navbar and NO website.sidebar key. The website: block holds only title and
    description (lines 12-14). metadata-files (lines 16-18, top level) lists _sidebar.yml.
    _sidebar.yml is generated by quartodoc (git-ignored) and supplies website.sidebar as a LIST with two items:
    id "reference" (docked, search, title "Air Ambulance Simulation"; contents: Introduction index.qmd,
    Project Overview readme.qmd, Class and Function Overview, Model Checklists, Package Details) and id "dummy-sidebar".
    Do not edit _sidebar.yml, and do not add tutorial entries to quartodoc.sidebar.contents (it is regenerated).
    The new sidebar id must differ from "reference"; Quarto picks the sidebar by which one contains the current page.
    There is no navbar today, so adding one is a visible change to the site's top bar. The plan below keeps it minimal.
    Other facts: project.output-dir is ../docs_quarto; a pre-render script sync_docs.py runs (see pre_render).
  insertion_plan: |
    Anchor (line 14 of _quarto.yml, the last child of "website:"):
      '  description: "Documentation for the vidigi pathway animation package"'
    Insert directly AFTER that line (2-space indent, list items indented under their key):
        navbar:
          left:
            - href: index.qmd
              text: Home
            - href: tutorial/index.qmd
              text: Tutorial
        sidebar:
          - id: tutorial
            title: Tutorial
            contents:
              - <filled in by the orchestrator>
    Notes: (a) The "Home" item is included so the new navbar does not leave only a Tutorial link; the orchestrator may
    drop it or add "- href: reference/index.qmd / text: Reference". (b) website.sidebar here is a list, and Quarto merges
    it with the list from _sidebar.yml (tested pattern in site-integration.md). (c) Do not touch the quartodoc: block
    (lines 20-107) or metadata-files (lines 16-18).

existing_pages:                      # hand-written pages in the docs dir (excluding reference/, _-prefixed, tutorial/)
  - path: index.qmd
    title: Air Ambulance Discrete Event Simulation (H1 only; no title field)
    summary: Stub landing page with a one-line welcome and toc front matter.
    covers: [welcome]
  - path: citation_details.qmd
    title: Citing this work
    summary: Includes ../CITATION.cff in a markdown block.
    covers: [citation]
  - path: readme.qmd
    title: Devon Air Ambulance Discrete Event Simulation
    summary: GENERATED by sync_docs.py from the repo README.md (git-ignored). Describes the DES model logic sequence, issue tracking and the API docs link.
    covers: [DES model logic, AMPDS card category, callsign choice, HEMS result, patient outcome]
    generated: true
  - path: STARS.qmd
    title: STARS (checklist)
    summary: GENERATED copy of checklists/STARS/STARS.qmd (git-ignored). Reporting checklist, about 70 KB.
    covers: [STARS reporting checklist]
    generated: true
  - path: STRESS_DES.qmd
    title: STRESS-DES
    summary: GENERATED copy of checklists/STRESS-DES/STRESS_DES.qmd (git-ignored). Currently "Coming soon!".
    covers: [STRESS-DES checklist]
    generated: true
  - path: licence.qmd
    title: Licence
    summary: GENERATED copy of the repo LICENSE (git-ignored).
    covers: [licence]
    generated: true
  - path: code_of_conduct.qmd
    title: Code of Conduct
    summary: GENERATED copy of CODE_OF_CONDUCT.md (git-ignored).
    covers: [contributor code of conduct]
    generated: true
  # background_information/, input_data/ and model_details/ exist but are empty.
  # Only index.qmd and citation_details.qmd are tracked; the others exist only after sync_docs.py has run.
  # Prefer linking to index.qmd and the reference pages; readme.qmd etc. are present now but are generated.

pre_render:
  script: sync_docs.py   # project.pre-render in _quarto.yml; runs on a whole-project render or preview, not necessarily for `quarto render <docs>/tutorial`
  what_it_does: |
    root = parent of the docs dir (the repo root). It copies, overwriting, into the docs dir:
    README.md -> readme.qmd; LICENSE -> licence.qmd; CODE_OF_CONDUCT.md -> code_of_conduct.qmd;
    checklists/STARS/STARS.qmd -> STARS.qmd; checklists/STRESS-DES/STRESS_DES.qmd -> STRESS_DES.qmd.
    Then it prepends a YAML header (format: html: toc: true, toc-expand: 3) to readme.qmd and rewrites
    "/reference/" to "../reference/" in it. It never touches tutorial/ or deletes anything.
    All five copied files are git-ignored.

house_style:
  front_matter_fields: [format.html.toc, format.html.toc-expand, title (only STRESS_DES.qmd), toc]
  callouts: none observed (pages are tiny or copies of repo files)
  code: no executable cells seen; site-level format.html.execute.freeze is auto. The include-code-files, code-window and code-line-style filters are enabled.
  notes: >
    Little hand-written evidence. README prose is plain and impersonal, British spelling ("Licence"), Title Case headings.
    Tutorial pages should carry title and description plus toc: true. Theme flatly/darkly with custom scss; body-width 1200px.

quartodoc:
  present: true
  package: air_ambulance_des
  reference_dir: reference
  reference_built: true              # 15 .qmd files in reference/ (including index.qmd and _api_index.qmd)
  reference_tracked_in_git: false    # /reference/ is git-ignored
  inventory: objects.json            # git-ignored too
  interlinks_filter: false           # filters: include-code-files, code-window, code-line-style, value-box
  link_style: relative
  note: >
    Page-level objects (sections.contents) are 13 classes/functions, each with its own page. objects.json lists
