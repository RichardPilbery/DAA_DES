data_flows:
  inputs:
    - what: "Scenario settings typed into the web app: number of runs, run length in days, start date and time, warm-up length, overall demand percentage, job-duration multiplier and master random seed"
      from: "user, on the web app's setup page"
      evidence: "app/_state_control.py:9-50; app/model.py:156-223"
    - what: "A filled-in Excel parameter template (rota, vehicle and registration list, servicing rules, summer/winter months, last service dates, allowed time ranges, school holidays)"
      from: "user upload on the setup page"
      evidence: "app/setup.py:114, 145-214"
    - what: "Predefined scenario spreadsheets (e.g. 24-hour running, extended critical care cover, two H145 aircraft)"
      from: "files shipped with the project, chosen in the web app"
      evidence: "scenarios/ folder; app/setup.py:122"
    - what: "Current rota, vehicle list, servicing rules, service history, school holidays and allowed time ranges, held as files the model reads at the start of every run"
      from: "project files (overwritten by the web app when a scenario is loaded)"
      evidence: "air_ambulance_des/class_hems_availability.py:97, 229-233, 300; air_ambulance_des/class_hems.py:48"
    - what: "Learned patterns from past jobs (calls per day by quarter, call timing by hour, call type, age, sex, care category, patient outcome, job stage durations, short-notice unavailability, share of jobs where a helicopter helps)"
      from: "files produced by the historical data preparer"
      evidence: "air_ambulance_des/utils.py:39-45; distribution_data/ folder; air_ambulance_des/des_hems.py:361-397"
    - what: "Real job-level records from Devon Air Ambulance for 2023-2024, used only by the historical data preparer"
      from: "a cleaned data extract placed in a folder that is kept out of version control"
      evidence: "run_dist_fit_utils.py:5; external_data/README.md; air_ambulance_des/distribution_fit_utils.py:178"
  stages:
    - what: "Settings or uploaded spreadsheet sheets are written over the model's current parameter files; a reset copies the default files back"
      component: streamlit_app
      evidence: "app/setup.py:198-214; app/_state_control.py:74-121"
    - what: "Each day, a number of calls is drawn from real past daily counts for that quarter, scaled by the demand percentage, and spread across the hours of the day"
      component: des_hems_model
      evidence: "air_ambulance_des/des_hems.py:228-241; air_ambulance_des/utils.py:652-670"
    - what: "Each made-up patient is given a call type, age, sex, care category, outcome and whether a helicopter would help"
      component: des_hems_model
      evidence: "air_ambulance_des/des_hems.py:303-411"
    - what: "A vehicle is chosen by the dispatch rules or, if none is free, the call is recorded as having no air ambulance resource available"
      component: resource_allocation
      evidence: "air_ambulance_des/des_hems.py:432-466, 492-497"
    - what: "The job moves through allocation, mobilising, travel to scene, on scene, travel to hospital and clearing, each with a drawn duration"
      component: des_hems_model
      evidence: "air_ambulance_des/des_hems.py:574-711"
    - what: "Runs are repeated with different random seeds (in parallel on a local computer, one after another on the hosted site) and combined"
      component: simulation_runner
      evidence: "air_ambulance_des/des_parallel_process.py:233-319, 200-211; app/model.py:143-224"
    - what: "Combined results are turned into missed-job figures, utilisation figures and charts, alongside historical figures"
      component: trial_results
      evidence: "app/model.py:245-291; air_ambulance_des/class_simulation_trial_results.py"
  outputs:
    - what: "Results tabs in the web app: summary of missed jobs and utilisation, key charts, comparison with historical data, additional outputs, and an optional animation"
      to: "shown on screen to the user"
      evidence: "app/model.py:226-240, 277-291"
    - what: "A downloadable HTML report of the results"
      to: "downloaded by the user (needs the Quarto publishing tool to be installed)"
      evidence: "app/_app_utils.py:83-140; app/model.py:1398-1407"
    - what: "Combined step-by-step results file and a record of the settings used"
      to: "the project's results folder"
      evidence: "air_ambulance_des/des_parallel_process.py:95-97, 200-211"
  storage:
    - what: "Run results, settings used, calculated service dates and daily availability are saved as files in the project's results folder"
      retention: "Replaced by the next run in most cases; one combined file is appended to on every run and is not cleared by the web app. How long files are kept beyond that is not determined from the code."
      evidence: "air_ambulance_des/des_hems.py:782-810; air_ambulance_des/class_hems_availability.py:295; air_ambulance_des/des_parallel_process.py:200-230"
    - what: "Scenario settings are stored by overwriting shared parameter files on disk, not per user"
      retention: "Until another scenario is loaded or the app is reset (the rota is reset to default when a new app session starts)"
      evidence: "app/setup.py:214; app/_state_control.py:61-67"
    - what: "Learned patterns and historical summaries are stored as files; re-running the historical data preparer deletes and rewrites them"
      retention: "Until the preparer is run again"
      evidence: "air_ambulance_des/distribution_fit_utils.py:130-141, 212-213"
  external:
    - what: "A public demonstration copy of the web app hosted on Streamlit Community Cloud"
      evidence: "README.md:113"
    - what: "On the hosted site, the report tool is downloaded from GitHub at run time"
      evidence: "app/_app_utils.py:31-65"
    - what: "The web app loads fonts and icons from outside websites (Google Fonts, Font Awesome) and a diagram image from GitHub"
      evidence: "app/model.py:58-59; app/acknowledgements.py:11-16; app/info.py:43"
  personal_data:
    - what: "The real job records read by the historical data preparer include each patient's age and sex, alongside incident date and time, call type and outcome"
      evidence: "air_ambulance_des/distribution_fit_utils.py:184-190, 330-347, 434"
    - what: "The model's made-up patients have an age and sex, but these are generated, not real people. Fields for postcode and location exist but are never filled in"
      evidence: "air_ambulance_des/class_patient.py:17-28; air_ambulance_des/des_hems.py:322-323"

decision_points:
  - plain: "Default scenario: 2 years (730 days) from 1 January 2023 at 08:00, 12 runs on a local computer or 5 on the hosted site, no warm-up, demand at 100%, job durations at 100%, master seed 42"
    evidence: "app/_state_control.py:9-50"
  - plain: "Daily call numbers are picked from real daily counts observed in the same quarter of the year, then multiplied by the demand percentage and rounded down"
    evidence: "air_ambulance_des/des_hems.py:76, 228-233; air_ambulance_des/utils.py:652-670"
  - plain: "Every call is treated as an air ambulance case; the alternative path for ordinary ambulance cases is a placeholder"
    evidence: "air_ambulance_des/des_hems.py:337-347"
  - plain: "Share of jobs where a helicopter would help, from past data: about 15% for regular jobs, 38% for critical care jobs and 10% for enhanced care jobs"
    evidence: "distribution_data/proportion_jobs_heli_benefit.txt; distribution_data/proportion_jobs_heli_benefit_cc.txt; distribution_data/proportion_jobs_heli_benefit_ec.txt; air_ambulance_des/des_hems.py:361-397"
  - plain: "For critical and enhanced care jobs, there is a fixed 50% chance the dispatcher knows the care need in advance and uses the care-matching rules; otherwise the regular rules are used"
    evidence: "air_ambulance_des/des_hems.py:432-443"
  - plain: "For regular jobs where a helicopter would help, there is a fixed 50% chance this is known in advance; if known, only a helicopter (critical care first) can be sent"
    evidence: "air_ambulance_des/class_hems_availability.py:16-18, 891-952"
  - plain: "Care-matching order: a helicopter of the matching care level first, then a car of the matching level, then a helicopter of the other level, then a car of the other level"
    evidence: "air_ambulance_des/class_hems_availability.py:552-579"
  - plain: "Regular jobs with no known helicopter need: the preferred crew group and vehicle type first, then any helicopter, then the preferred crew group, then any free vehicle"
    evidence: "air_ambulance_des/class_hems_availability.py:960-989"
  - plain: "A vehicle can only be sent if it is on shift, not being serviced, not already busy, and its crew group is not already out on another job"
    evidence: "air_ambulance_des/class_hems_availability.py:516-529, 902-914"
  - plain: "Calls are never held in a queue: if nothing suitable is free at that moment, the call is recorded as missed"
    evidence: "air_ambulance_des/des_hems.py:464-466, 492-497"
  - plain: "Helicopters can be randomly unavailable at short notice (for example weather or crew), using past rates by aircraft, quarter and six-hour time band; cars are always assumed available"
    evidence: "air_ambulance_des/utils.py:957-1010; air_ambulance_des/class_hems_availability.py:531-546"
  - plain: "Default rota: helicopter H70 and car CC70 (crew group 70) 07:00-19:00 as critical care and 19:00-02:00 as enhanced care; H71 and CC71 07:00-19:00 in summer, 07:00-17:00 in winter; car CC72 08:00-18:00"
    evidence: "actual_data/HEMS_ROTA_DEFAULT.csv"
  - plain: "Summer shift hours apply from April to October"
    evidence: "actual_data/rota_start_end_months_DEFAULT.csv; air_ambulance_des/class_hems.py:48-63, 104-120"
  - plain: "Servicing: the H145 every 8 months and the EC135 every 12 months, each for 3 weeks, preferring January, moved earlier day by day to avoid school holidays and other aircraft being serviced"
    evidence: "actual_data/service_schedules_by_model_DEFAULT.csv; air_ambulance_des/class_hems_availability.py:55, 749-793"
  - plain: "When the H145 (G-DAAS) is being serviced, the EC135 (G-DAAN) takes over the H70 callsign"
    evidence: "air_ambulance_des/class_hems_availability.py:139-160; air_ambulance_des/class_hems.py:72-86"
  - plain: "Job stage durations are drawn from patterns fitted to past data and kept within set limits (for example travel to scene 1-59 minutes, on scene 1-119 minutes, travel to hospital 1-139 minutes)"
    evidence: "actual_data/upper_allowable_time_bounds_DEFAULT.csv; air_ambulance_des/utils.py:580-606"
  - plain: "Patient ages above 115 are redrawn"
    evidence: "air_ambulance_des/des_hems.py:322; air_ambulance_des/utils.py:553-578"
  - plain: "Headline figures are averaged across all runs"
    evidence: "app/model.py:281-287"
  - plain: "Automated checks compare model output with historical data and warn or fail when distributions differ by more than set amounts (for example 10% warn and 20% fail for some comparisons)"
    evidence: "tests/test_against_reality.py:131-133, 198-200"
  - plain: "Daily call numbers are drawn from a pool of real daily counts from 2023-2024 for the same quarter, with 2024 days given slightly more weight (each real 2024 day appears 11 times in the pool, each 2023 day 10 times). Pool averages: about 6.8 calls a day in January-March (range 2-19), 7.6 in April-June (2-25), 7.6 in July-September (1-18) and 6.6 in October-December (1-14)"
    evidence: "air_ambulance_des/distribution_fit_utils.py:580-645; distribution_data/inc_per_day_samples.json; air_ambulance_des/utils.py:652-671"
  - plain: "Each day's calls are shared out across the hours of the day using the real hourly pattern for that quarter; within each hour, calls are placed one after another at random minutes"
    evidence: "air_ambulance_des/des_hems.py:126-161, 250-284; distribution_data/hourly_arrival_by_qtr_probs.csv"
  - plain: "Each call's type (AMPDS card) is drawn from the real mix of call types for that hour of the day; the patient's sex and age are then drawn from the real pattern for that call type"
    evidence: "air_ambulance_des/utils.py:289-301, 536-578; distribution_data/hour_by_ampds_card_probs.csv; distribution_data/sex_by_ampds_card_probs.csv; distribution_data/age_distributions.txt"
  - plain: "Care category is drawn from the real share for that call type; for example, for AMPDS card 09 about 7% critical care, 17% enhanced care and 76% regular. In the real records a job counts as critical care if a critical care benefit was recorded, otherwise enhanced care if an enhanced care benefit was recorded, otherwise regular"
    evidence: "air_ambulance_des/utils.py:325-341; distribution_data/enhanced_or_critical_care_by_ampds_card_probs.csv; air_ambulance_des/distribution_fit_utils.py:647-684"
  - plain: "Patient outcome is drawn from the real mix for that care category and quarter, before any vehicle is chosen"
    evidence: "air_ambulance_des/des_hems.py:330; air_ambulance_des/utils.py:509-533; distribution_data/patient_outcome_by_care_category_and_quarter_probs.csv"
  - plain: "Each call is given a preferred crew group with the same odds for every call, whatever its type, care category or time: group 70 about 73%, group 71 about 15%, group 72 about 12%. These odds were learned only from past jobs that did not overlap another job and when no aircraft was recorded offline, to reflect who would be sent if everything was free"
    evidence: "air_ambulance_des/utils.py:373-385; distribution_data/callsign_group_probs.csv; air_ambulance_des/distribution_fit_utils.py:928-1050"
  - plain: "Each call is given a preferred vehicle type from its preferred crew group and the quarter: for group 70 a helicopter about 66% of the time in January-March, 83% in April-June, 77% in July-September and 60% in October-December; for group 71 about 72%, 73%, 81% and 58%; group 72 is always a car"
    evidence: "air_ambulance_des/des_hems.py:418-420; air_ambulance_des/utils.py:400-417; distribution_data/vehicle_type_by_quarter_probs.csv"
  - plain: "Once a vehicle is assigned, the job's result (stood down, landed but no patient contact, patient treated but not conveyed by HEMS, conveyed by HEMS, or conveyed by land with HEMS) is drawn from the real mix for that patient outcome, quarter, vehicle type, crew group and time of day (day is 07:00-18:59, night is the rest)"
    evidence: "air_ambulance_des/des_hems.py:519-526; air_ambulance_des/utils.py:445-507; distribution_data/hems_results_by_patient_outcome_and_time_of_day_and_quarter_and_vehicle_type_and_callsign_group_probs.csv"
  - plain: "The job's result decides which stages happen: a stood-down job has allocation, mobilising and clearing only; 'landed but no patient contact' and 'treated but not conveyed' jobs have no travel to hospital; conveyed jobs have every stage"
    evidence: "air_ambulance_des/des_hems.py:545-559, 574-698"
  - plain: "Each stage time is drawn by vehicle type (helicopter or car) and stage, and redrawn until it falls within set limits (allocation 0-119 minutes, mobilising 0-29, travel to scene 1-59, on scene 1-119, travel to hospital 1-139, clearing 1-89). Every stage time is then multiplied by the job-duration setting (default 1.0)"
    evidence: "actual_data/upper_allowable_time_bounds_DEFAULT.csv; air_ambulance_des/utils.py:580-607; air_ambulance_des/des_hems.py:579-698; app/_state_control.py:31"
  - plain: "A vehicle counts as on shift if the call's clock hour is at or after its start hour and before its end hour; overnight shifts wrap round midnight, so a 19:00-02:00 shift covers calls from 19:00 to 01:59. This is checked only when a call arrives"
    evidence: "air_ambulance_des/utils.py:303-323; air_ambulance_des/class_hems.py:107-120; air_ambulance_des/class_hems_availability.py:516-529"
  - plain: "When a vehicle is sent, the other vehicle in the same crew group with the same care level, if on shift, is taken out of use too until the job is cleared, so one crew is never in two places"
    evidence: "air_ambulance_des/class_hems_availability.py:648-668, 680-700, 1055-1075"
  - plain: "Short-notice unavailability is drawn afresh for each helicopter every time it is considered for a call, with the reasons aircraft, crew or weather. The rates are the share of rostered time each aircraft was recorded offline between August 2022 and July 2024, by quarter and six-hour band (00:00-05:59, 06:00-11:59, 12:00-17:59, 18:00-23:59). Example for January-March, 06:00-11:59: G-DAAS available about 90% (crew 5%, weather 4%, aircraft 1%); G-DAAN available about 82% (weather 17%). Where data are missing, averages from other time bands or other aircraft are used; if there are none, the helicopter is treated as available"
    evidence: "air_ambulance_des/utils.py:957-1050; distribution_data/ad_hoc_unavailability.csv; air_ambulance_des/distribution_fit_utils.py:300-303, 2297-2688"
  - plain: "Servicing dates: starting from the last service (G-DAAS 4 January 2022, G-DAAN 20 March 2022), the next service is due one interval later (8 months for the H145, 12 for the EC135), counted from the previous service start. If the due date falls in January (from the 2nd), the service moves to 2 January provided that is clear of school holidays; due dates in other months are kept. The start is then moved back a day at a time until the whole 3-week service is clear of school holidays and of other aircraft's services. A 4-week overrun buffer setting exists but does not appear to affect the dates. Cars are not serviced"
    evidence: "actual_data/service_history_DEFAULT.csv; actual_data/service_schedules_by_model_DEFAULT.csv; air_ambulance_des/class_hems_availability.py:55-56, 245-285, 749-793"
  - plain: "Vehicles are moved in and out of servicing once a day, at the first moment of each simulated day; a vehicle is out from its service start date to its service end date inclusive"
    evidence: "air_ambulance_des/des_hems.py:244-248; air_ambulance_des/class_hems_availability.py:130-200; air_ambulance_des/class_hems.py:91-105"
  - plain: "When G-DAAN takes over the H70 callsign during G-DAAS's servicing, it appears to keep its own H71 shift hours and enhanced care level, so in that period no helicopter is rostered as critical care or for the 19:00-02:00 shift"
    evidence: "air_ambulance_des/class_hems.py:72-86; air_ambulance_des/class_hems_availability.py:139-160, 299-325; actual_data/HEMS_ROTA_DEFAULT.csv; actual_data/callsign_registration_lookup_DEFAULT.csv"
  - plain: "Missed jobs are calls for which no vehicle was assigned. Yearly figures are the count divided by the number of runs and by the run length in days, multiplied by 365"
    evidence: "air_ambulance_des/class_simulation_trial_results.py:2250-2404"
  - plain: "Utilisation for each vehicle is the time from being assigned to a job until clear, divided by its rostered hours from the summer and winter rota. Rostered hours are not reduced for servicing or short-notice unavailability, and the paired vehicle taken out of use alongside it is not counted as busy"
    evidence: "air_ambulance_des/class_simulation_trial_results.py:279-422, 424-585; air_ambulance_des/des_hems.py:537, 719"
  - plain: "The historical missed-job rate is the share of real 2023-2024 calls where no Devon Air Ambulance resource was recorded as attending. Because care category is only known for attended jobs, the historical missed figures by care category and the 'suboptimal allocation' comparisons come from the model run on the historic rotas, not from real records"
    evidence: "air_ambulance_des/distribution_fit_utils.py:1827-1871; air_ambulance_des/class_historic_results.py:484-520, 603-650; app/model.py:399-408, 451-460"
  - plain: "On the results summary, the 'estimated range' printed beside each simulated missed-job figure (critical care, enhanced care, regular) is taken from the historic-rota model run, not from the scenario being tested"
    evidence: "app/model.py:382-392"
  - plain: "Checks against real data run the model on the historic rotas (10 runs of 4 years). Average comparisons (monthly calls, job durations) fail when the difference is statistically significant (p below 0.05) and the effect size (Cohen's d) is above 0.5, and warn above 0.2. Distribution comparisons (daily calls, total job durations) warn when the KS statistic is above 0.1 and fail when significant and above 0.2. Job splits by crew group and callsign fail if any group's share differs from history by more than 10 percentage points and warn from 5; a chi-squared test with Cramer's V also fails when significant and V is 0.3 or more"
    evidence: "tests/test_against_reality.py:90-229, 310-313, 709-834; tests/helpers.py:32-123; tests/conftest.py:71-80"
  - plain: "Other automated checks: vehicles never respond off shift or while being serviced; the same vehicle or crew group is never sent to two jobs at once; a known helicopter benefit never gets a car; adding a helicopter or car, or lengthening hours, answers more calls in every one of 10 one-year runs (and the reverse); more demand gives more calls; days with no calls are handled; school holidays are read as UK dates, none longer than 7 weeks and averaging 1-3 weeks; and a fixed 5-run, 730-day scenario with seed 42 must reproduce a stored baseline exactly"
    evidence: "tests/test_unittest_model.py:236-316, 416-1000; tests/test_resource_allocation.py:81-122; tests/test_against_condition_changes.py:1-43, 68-160; tests/test_call_generation.py:1-30; tests/test_school_holidays.py:54-56, 192-220; tests/README.md:70-87"

assumptions:
  - plain: "Assumes future demand looks like 2023-2024 demand, adjusted only by a single overall percentage; seasonal demand adjustment is switched off"
    evidence: "air_ambulance_des/des_hems.py:228-233; app/_app_utils.py:387; historical_data/historical_monthly_totals_all_calls.csv (2023-01 to 2024-12)"
  - plain: "Ignores geography: no locations, distances or base positions are used, so travel times come from past averages, not from where the incident is"
    evidence: "air_ambulance_des/class_patient.py:17-21 (location fields never filled); roadmap.md (geography listed as future work)"
  - plain: "Assumes cars are never unavailable at short notice"
    evidence: "air_ambulance_des/class_hems_availability.py:532-540, 917-925"
  - plain: "Assumes a missed call is simply passed to another service; no queueing or waiting is modelled"
    evidence: "air_ambulance_des/des_hems.py:464-466, 492-497"
  - plain: "Assumes a single user at a time: scenario settings are written to shared files, so two people using the same installation at once could overwrite each other's scenario"
    evidence: "app/setup.py:214; app/_state_control.py:61-67, 74-121"
  - plain: "Assumes the real job records used to learn patterns are complete and correctly formatted; there is no checking of that file"
    evidence: "air_ambulance_des/distribution_fit_utils.py:172-182 (note says checking logic is still required)"
  - plain: "Assumes school holiday dates are provided for the whole simulated period; the default list runs to the end of 2027"
    evidence: "actual_data/school_holidays_DEFAULT.csv; air_ambulance_des/class_hems_availability.py:97, 716-733"
  - plain: "Assumes a servicing slot can always be found by moving earlier; if none fits, the model can hang"
    evidence: "air_ambulance_des/class_hems_availability.py:781-791"
  - plain: "Several rules are built around the current fleet's named aircraft (G-DAAS and G-DAAN) and callsigns H70 and H71, so other fleet layouts may not behave as expected"
    evidence: "air_ambulance_des/class_hems_availability.py:139-160; air_ambulance_des/class_hems.py:72-86"
  - plain: "A newly added helicopter with no past unavailability record borrows the average rate of the other aircraft"
    evidence: "air_ambulance_des/utils.py:977-989"
  - plain: "The 50% chances that a care need or helicopter benefit is known in advance are fixed estimates, not learned from data"
    evidence: "air_ambulance_des/class_hems_availability.py:16-18; air_ambulance_des/des_hems.py:434"
  - plain: "A rule intended to count every patient flown by helicopter as having a helicopter benefit checks the outcome before it has been decided, so it appears to have no effect"
    evidence: "air_ambulance_des/des_hems.py:408-409 (outcome only set later at des_hems.py:520; starts empty at class_patient.py:52)"
  - plain: "Results on the hosted site and on a local computer use different ways of deriving each run's random seed, so the same settings may give slightly different numbers in the two places"
    evidence: "app/model.py:177 versus air_ambulance_des/des_parallel_process.py:296-298"
  - plain: "Times are tracked in minutes of simulated time from the chosen start date"
    evidence: "app/model.py:160-161; air_ambulance_des/des_hems.py:206"
  - plain: "Within an hour, if the random gaps between calls add up to 59 minutes, any remaining calls for that hour are not created, so very busy hours may be slightly under-filled"
    evidence: "air_ambulance_des/des_hems.py:250-271"
  - plain: "Stage-time patterns were fitted separately for each job result, but the model looks them up by vehicle type and stage only, so it appears to use one result's pattern for every job (currently 'landed but no patient contact' for most stages and 'conveyed by land with HEMS' for travel to hospital), rather than matching times to the job's result"
    evidence: "air_ambulance_des/utils.py:588, 933-953; distribution_data/activity_time_distributions.txt; air_ambulance_des/distribution_fit_utils.py:350-417"
  - plain: "Short-notice unavailability does not last: it is a fresh draw for each call, so a helicopter grounded by weather for one call can be available for the next call minutes later"
    evidence: "air_ambulance_des/class_hems_availability.py:531-546, 916-931; air_ambulance_des/utils.py:957-1050"
  - plain: "The short-notice unavailability rates were worked out treating summer as April-September, while the default rota treats summer as April-October"
    evidence: "air_ambulance_des/distribution_fit_utils.py:2332-2360; actual_data/rota_start_end_months_DEFAULT.csv"
  - plain: "A job that starts near the end of a shift carries on to completion; there is no handover or early stand-down at shift end"
    evidence: "air_ambulance_des/class_hems.py:107-120 (on-shift checked only at allocation); air_ambulance_des/des_hems.py:574-721"
  - plain: "Rostered hours used for utilisation are not reduced when an aircraft is being serviced, although the description of that calculation says servicing is taken into account, so utilisation for serviced aircraft may be understated"
    evidence: "air_ambulance_des/class_simulation_trial_results.py:279-422 (servicing dates read at 302-315 but not subtracted)"
  - plain: "The preferred crew group does not depend on call type, care category, time of day or season"
    evidence: "air_ambulance_des/utils.py:373-385"
  - plain: "A 'missed' job means something slightly different in the model (no suitable vehicle free at that moment) and in the real records (no Devon Air Ambulance resource recorded as attending, for any reason)"
    evidence: "air_ambulance_des/des_hems.py:492-497; air_ambulance_des/distribution_fit_utils.py:1832-1836"

dependencies:
  - plain: "Python, the programming language the whole model is written in"
  - plain: "SimPy, a free add-on that provides the clock and queues for the simulation"
  - plain: "Streamlit, a free toolkit used to build the web app"
  - plain: "Streamlit Community Cloud, an outside hosting service for the public demonstration copy (slower, fewer runs, no parallel running)"
  - plain: "Pandas, NumPy and SciPy, free data and statistics add-ons used throughout"
  - plain: "Fitter, a free add-on that chooses which statistical pattern best matches past data"
  - plain: "Plotly, a free charting add-on used for the results charts"
  - plain: "Joblib, a free add-on that runs several model runs at once on a local computer"
  - plain: "Quarto, a separate free publishing tool needed only for the downloadable report"
  - plain: "GitHub, which hosts the code, issue list and automatically built technical documentation"
  - plain: "A cleaned extract of Devon Air Ambulance job records, needed to refresh the learned patterns; not included in the project"

glossary:
  - term: the web app
    definition: The set of web pages where users choose a scenario, run the model and view the results.
    technical_name: Streamlit app (app/)
  - term: the run manager
    definition: The part that repeats the model many times with different random chances and combines the results.
    technical_name: des_parallel_process
  - term: the pattern sampler
    definition: The part that holds patterns learned from past jobs and draws realistic values from them.
    technical_name: Utils
  - term: the call simulator
    definition: The part that creates each day's made-up calls and patients and plays out each job step by step.
    technical_name: DES_HEMS, Patient
  - term: the fleet and rota model
    definition: The part that represents each helicopter and car, its shift hours and its servicing dates.
    technical_name: HEMS, HEMSAvailability
  - term: the dispatch rules
    definition: The part that decides which vehicle, if any, goes to each call.
    technical_name: HEMSAvailability allocation methods, ResourceAllocationReason
  - term: the results and comparison tool
    definition: The part that turns run records into figures and charts and compares them with real past performance.
    technical_name: TrialResults, SimulationInputs, HistoricResults
  - term: the historical data preparer
    definition: An occasional, separate step that turns real job records into the patterns and summaries the model uses.
    technical_name: DistributionFitUtils
  - term: simulation
    definition: A computer model that imitates a real service over time, so that changes can be tried out safely.
  - term: discrete event simulation
    definition: A type of simulation that jumps from one event (a call, a vehicle leaving, a job ending) to the next.
  - term: run (replication)
    definition: One complete play-through of the simulated period. The model does many runs, each with different random chances, and averages them.
  - term: random seed
    definition: A starting number that fixes the random chances, so the same seed and settings give the same results again.
    technical_name: master_seed
  - term: warm-up period
    definition: An optional stretch at the start of a run that is left out of the results, so the model starts from a "busy" state.
  - term: scenario
    definition: A set of settings (rota, fleet, servicing, demand) to test.
  - term: parameter template
    definition: An Excel workbook the user fills in to describe a scenario and upload to the web app.
  - term: rota
    definition: The table of which vehicles are on shift at which hours, with separate summer and winter hours.
    technical_name: HEMS_ROTA
  - term: callsign
    definition: The radio name of a vehicle on duty, such as H70 (a helicopter) or CC72 (a car).
  - term: callsign group
    definition: Vehicles that share one crew, such as helicopter H70 and car CC70; only one can be out at a time.
  - term: registration
    definition: The aircraft's or car's own identifier, such as G-DAAS, which stays the same even if its callsign changes.
  - term: critical care (CC)
    definition: The highest level of pre-hospital care the service provides; one of the three care categories in the model.
  - term: enhanced care (EC)
    definition: A level of care above standard ambulance care but below critical care.
  - term: regular job (REG)
    definition: A job not identified as needing critical or enhanced care.
  - term: helicopter benefit
    definition: Whether a patient would gain from a helicopter rather than a car, for example for speed or access.
  - term: AMPDS card
    definition: The category the 999 call-handling system gives to a call, describing the type of emergency.
  - term: missed job
    definition: A call for which no air ambulance vehicle was free and suitable at the time, so none was sent.
  - term: utilisation
    definition: The share of a vehicle's on-shift hours spent on jobs.
  - term: short-notice (ad hoc) unavailability
    definition: Times a helicopter cannot fly although on shift, for example due to weather or crew issues.
  - term: servicing
    definition: Planned maintenance that takes an aircraft out of use for several weeks.
  - term: historical baseline
    definition: Model results using the rotas that actually ran in the past, used to check the model against reality.
  - term: event log
    definition: The record of every step of every simulated job, from which all results are calculated.
    technical_name: run_results.csv
  - term: learned patterns (fitted distributions)
    definition: Mathematical descriptions of past data, such as how long time on scene usually takes, which the model draws from.
  - term: open-source licence
    definition: The terms under which the code can be used and changed; this project uses GPL-3.0.
  - term: hosted site
    definition: A copy of the web app running on an outside service, reachable in a browser without installing anything.
  - term: automated tests
    definition: Checks, run on request by the developers, that confirm the model still behaves as expected.
  - term: HEMS
    definition: Helicopter emergency medical service; in this model, any Devon Air Ambulance helicopter or critical care car.
  - term: preferred crew group and vehicle type
    definition: The crew group and vehicle the model assumes would be sent to a call if everything were free, drawn from past patterns before the dispatch rules check what is actually available.
  - term: HEMS result
    definition: What happened once a vehicle was sent, such as stood down, landed but no patient contact, treated but not conveyed, conveyed by HEMS or conveyed by land with HEMS.
  - term: stand down
    definition: A job cancelled after the vehicle was assigned and before it reached the scene.
  - term: patient outcome
    definition: The recorded outcome for the patient (for example deceased), drawn from past patterns for the care category and quarter.
  - term: job stages
    definition: The steps of a simulated job - allocation, mobilising, travel to scene, on scene, travel to hospital and clearing - each with its own drawn time.
  - term: quarter
    definition: A three-month part of the year (January-March, April-June, July-September, October-December), used to vary many of the learned patterns by season.
  - term: demand percentage
    definition: A single setting that scales every day's number of calls up or down (100% means the same as 2023-2024).
  - term: job-duration multiplier
    definition: A single setting that stretches or shrinks every stage time of every job (1.0 means unchanged).
  - term: statistically significant (p-value)
    definition: A test result showing a difference is unlikely to be down to chance alone; the checks here use a cut-off of 0.05.
  - term: effect size (Cohen's d)
    definition: How large a difference between two averages is, relative to their spread; 0.2 is usually called small and 0.5 medium.
  - term: KS statistic
    definition: The largest gap between two cumulative distributions; 0.1 means the shares below some value differ by up to 10 percentage points.
  - term: chi-squared test and Cramer's V
    definition: A test of whether two sets of category counts (such as jobs per callsign) differ, and a 0-to-1 measure of how strongly they differ.
  - term: backtest
    definition: An automated check that a fixed scenario still gives exactly the same results as a stored earlier run, to catch unintended changes.
  - term: annualised figure
    definition: A count converted to a per-year rate by dividing by the run length in days and multiplying by 365.

pages:
  stakeholder-decision-maker:
    - page: overview
      focus: >
        What the model is (a planning tool for Devon Air Ambulance helicopter and car cover, not a live
        dispatch system) and who built it. Plain system diagram of the eight parts. Project signals:
        version 1.0.0 released May 2025, 46 changes in the last 12 months by a single contributor,
        automated tests exist but are not run automatically on each change, GPL-3.0 open licence.
        Known-issues note: a number of open issues concern differences from historical figures,
        servicing scheduling (including a possible hang) and the hosted demonstration site.
      uses: [plain_summary, components, relationships, evidence.project_signals, evidence.issues]
    - page: what-it-does
      focus: >
        The planning problem it addresses (testing rota, fleet, servicing and demand changes without
        real-world risk) and what it produces: missed-job estimates, utilisation per vehicle, call
        patterns and side-by-side comparison with 2023-2024 actuals, on screen and as a downloadable
        report. Worked example: loading the "24 hour running" or "Two EC 145" scenario and comparing
        missed jobs with the default rota. Be clear about what it does not do: no live dispatch,
        no geography, no ordinary ambulance modelling.
      uses: [plain_summary, data_flows.inputs, data_flows.outputs, components.streamlit_app, components.trial_results, decision_points]
    - page: how-it-works
      focus: >
        One page of essentials: past job records feed the historical data preparer, which supplies the
        pattern sampler; the user sets a scenario in the web app; the run manager repeats the call
        simulator many times; the dispatch rules pick a vehicle from the fleet and rota model or record
        a missed job; the results and comparison tool summarises against history. Flowchart of at most
        eight boxes, then one short paragraph per part.
      uses: [components, relationships, data_flows.stages]
    - page: assumptions-limits
      focus: >
        Demand mirrors 2023-2024 with one overall percentage; no geography or distance; cars never
        unavailable at short notice; missed calls are not queued; fixed 50% guesses about what the
        dispatcher knows; rules tied to the named aircraft and callsigns; school holidays only to end
        of 2027; one user at a time on an installation; a helicopter-benefit rule that appears to have
        no effect. Known open questions from the issue list: differences from historical metrics,
        crew-group 70/71 split slightly off history, allocation logic under review, utilisation charts
        breaking when a vehicle pairing is removed. Close with the technical-team callout.
      uses: [assumptions, decision_points, evidence.issues, evidence.markers]
    - page: risks
      focus: >
        Decision risk from over-trusting point figures (results are averages of random runs and rest on
        past patterns); a run can hang if servicing cannot be scheduled; shared parameter files can be
        overwritten by another user or by running the tests; hosted and local results can differ
        slightly; the historical data preparer reads patient-level records with age and sex and does no
        input checking; hosted site downloads tools and loads fonts from outside services. Mitigations
        in place: automated tests including comparison against reality and a stored baseline,
        reproducible seeds, a reset-to-defaults option, raw records kept out of version control.
        What is missing: tests do not run automatically on each change, no tests for the utilisation
        calculation. Close with the technical-team callout.
      uses: [assumptions, dependencies, data_flows.personal_data, data_flows.storage, data_flows.external, evidence.project_signals, evidence.issues, evidence.tests]
    - page: keeping-it-running
      focus: >
        What it depends on (Python and free add-ons, Streamlit hosting for the demo, Quarto for reports,
        GitHub). Maintenance signals: one active contributor in the last year, last change October
        2026, release 1.0.0, documentation built automatically. Upkeep tasks: refreshing learned patterns
        requires the confidential job extract and re-running the historical data preparer; extending
        school holiday dates beyond 2027; updating service history dates; keeping pinned add-on
        versions current. Hosted demo is slower and limited to 5 runs by default.
      uses: [dependencies, data_flows.storage, evidence.project_signals, evidence.repo_docs, components.distribution_fitting]
    - page: questions-to-ask
      focus: >
        Questions on: how close results are to reality and on which measures; how and when learned
        patterns will be refreshed with newer data, and who holds the job extract; where the 50%
        dispatcher-knowledge figures come from; whether the helicopter-benefit rule that appears inactive
        is intended; how a fleet change beyond the current named aircraft would be handled; the servicing
        hang risk; multi-user use; whether tests will run automatically; how many runs are enough;
        succession if the single active contributor is unavailable; who governs access to the
        patient-level records used to build the patterns.
      uses: [assumptions, decision_points, dependencies, data_flows.personal_data, evidence.issues, evidence.project_signals]
    - page: glossary
      focus: Every plain component name and unavoidable term used on these pages, with technical names for talking to developers.
      uses: [glossary]
  stakeholder-domain-expert:
    - page: overview
      focus: >
        What the model is in HEMS terms: a planning simulation of Devon Air Ambulance helicopter and
        critical care car tasking, built from 2023-2024 job records, not a live dispatch or
        clinical decision tool. Who it is for (clinicians, operational managers, service analysts)
        and how to use this guide: start with how-decisions-are-made to sanity-check the rules
        against your own experience. Plain system diagram of the eight parts. Project signals in
        one line (version 1.0.0, single active contributor, automated checks exist but are run by
        hand). Known-issues note, reworded: open questions about differences from historical
        figures, the crew group 70/71 split, the dispatch logic being under review, and servicing
        scheduling.
      uses: [plain_summary, components, relationships, evidence.project_signals, evidence.issues]
    - page: what-it-does
      focus: >
        The operational questions it can test (rota hours, number and type of aircraft and cars,
        servicing intervals, overall demand, job lengths) and what it gives back: missed jobs
        overall and by care category, critical care jobs sent an enhanced care resource,
        helicopter-benefit jobs sent a car, utilisation per callsign, call patterns by hour, day
        and month, job stage times and HEMS results, each beside 2023-2024 figures. Inputs a
        domain expert recognises: the rota table with summer and winter hours, callsign and
        registration list, servicing intervals and last service dates, school holidays, allowed
        stage-time limits. Worked example: the default rota (H70/CC70 07:00-19:00 critical care
        and 19:00-02:00 enhanced care; H71/CC71; CC72 08:00-18:00) against the extended critical
        care cover scenario. State clearly what it does not model: locations, distances and
        bases, ordinary ambulance response, queued or held calls, handovers.
      uses: [plain_summary, data_flows.inputs, data_flows.outputs, components.streamlit_app, components.trial_results, decision_points]
    - page: how-it-works
      focus: >
        The life of one simulated call, in dispatch language: the day's call count, the call's
        hour and AMPDS card, age and sex, care category and patient outcome, preferred crew group
        and vehicle, the dispatch rules choosing a vehicle (or recording a missed job), the HEMS
        result, then the job stages to clear. Then where the patterns come from (the historical
        data preparer and the pattern sampler), how the fleet and rota model handles shifts,
        summer and winter hours and servicing, and how the run manager repeats runs. Flowchart of
        at most eight boxes, then one short section per part. Explain random runs briefly as
        repeated plausible years, not predictions of a specific day.
      uses: [components, relationships, data_flows.stages, decision_points]
    - page: how-decisions-are-made
      focus: >
        The core page; thorough and in domain terms, with real values in tables. Group as follows.
        (1) Call demand: daily counts drawn from real 2023-2024 days by quarter (2024 weighted
        1.1), quarterly averages 6.6-7.6 a day, scaled by the demand percentage and rounded down;
        spread by the hourly pattern for the quarter; seasonal demand adjustment switched off.
        (2) The patient: AMPDS card by hour, age (redrawn above 115) and sex by card, care category
        by card with the CC-then-EC-then-regular rule used on the real records, patient outcome by
        care category and quarter, helicopter benefit shares (about 15% regular, 38% critical
        care, 10% enhanced care), and the helicopter-benefit rule for conveyed patients that
        appears to have no effect. (3) Preferred crew group (70 73%, 71 15%, 72 12%) and preferred
        vehicle by group and quarter. (4) Dispatch: the 50% chance that a critical or enhanced care
        need is known in advance and the care-matching order; the 50% chance a helicopter benefit
        is known for regular jobs and the helicopter-only rule (critical care helicopter first, no
        car if none); the regular-job order; the eligibility rules (on shift by clock hour, not
        being serviced, not busy, crew group free); the paired vehicle being stood down with it;
        no queueing. (5) Short-notice unavailability: per-call draw for helicopters only, rates by
        aircraft, quarter and six-hour band, with the January-March morning example and fallbacks.
        (6) Rota and seasons: default rota table, summer April-October, overnight shifts wrapping
        midnight, jobs running past shift end. (7) Servicing: intervals (H145 8 months, EC135 12
        months, 3 weeks), last service dates, the January rule as it actually works, moving back
        day by day for school holidays (default list to end of 2027) and other services, the
        unused 4-week buffer, the possible hang, G-DAAN taking the H70 callsign while keeping its
        own hours and enhanced care level. (8) Job stages and results: HEMS result by outcome,
        quarter, vehicle, crew group and day (07:00-18:59) or night; which stages each result
        has; stage-time limits; the job-duration multiplier; the stage-time patterns not matched
        to the job's result. (9) Defaults: run length, runs, seed, warm-up. Then "How to check it
        yourself": compare the default rota and stage-time limits with your own knowledge, check
        daily call averages by quarter, look at the helicopter/car split for group 70 by quarter,
        and use the comparison tab against 2023-2024. Close with the automated checks, in plain
        terms with their thresholds: comparison with reality (Cohen's d 0.2 warn / 0.5 fail; KS
        0.1 / 0.2; crew group and callsign shares 5 / 10 percentage points), behaviour checks
        (no off-shift or in-service responses, no double-tasking, a known helicopter benefit
        never gets a car, more vehicles or longer hours answer more calls), school holiday
        plausibility, and the exact backtest. Note that the checks are run by hand, not
        automatically on every change, and that no check covers the utilisation calculation.
      uses: [decision_points, assumptions, components.des_hems_model, components.resource_allocation, components.hems_resources, components.sampling_utils, components.distribution_fitting, evidence.tests, evidence.repo_docs]
    - page: reading-results
      focus: >
        How to read each output and the common misreadings. All headline figures are averages
        across runs (12 locally, 5 on the hosted site by default); look at the spread, not just the
        average, and use enough runs. Missed jobs mean no suitable vehicle free at the moment of
        the call, annualised by dividing by run length and multiplying by 365; this is not the
        same as the real-records definition (no Devon Air Ambulance resource recorded as
        attending). The historical comparison for missed jobs by care category and for suboptimal
        allocation comes from the model run on historic rotas, not real records, and the
        'estimated range' beside the simulated missed-job figures is taken from that historic run,
        not the scenario. Utilisation is time from assignment to clear over rostered hours, not
        reduced for servicing or short-notice unavailability, and the paired vehicle stood down
        with it is not counted; it may be understated for serviced aircraft and can break when a
        vehicle pairing is removed. Stage times are not matched to the job's result. Small
        differences between scenarios may be within run-to-run variation; hosted and local results
        can differ slightly for the same settings. Suggest reading the comparison tab first to
        judge how well the baseline matches 2023-2024 before trusting scenario differences.
      uses: [data_flows.outputs, decision_points, assumptions, components.trial_results, evidence.issues]
    - page: assumptions-limits
      focus: >
        In domain terms, separating what the code does from what it assumes. Demand mirrors
        2023-2024 with one overall percentage; no geography, distances or base locations, so
        travel times come from past averages; no ordinary ambulance modelling and no queueing of
        calls; cars never unavailable at short notice; helicopter unavailability is a fresh draw
        per call rather than a lasting period (weather does not persist), and its rates used
        April-September as summer while the rota uses April-October; fixed 50% guesses about what
        the dispatcher knows; preferred crew group the same for all calls; jobs carry on past
        shift end; busy hours may be slightly under-filled; stage-time patterns not matched to job
        result; the helicopter-benefit rule for conveyed patients appears to have no effect;
        G-DAAN covering H70 keeps its own hours and care level; rules tied to the named aircraft
        and callsigns; servicing January preference narrower than it sounds, the overrun buffer
        unused and a possible hang; school holidays only to end of 2027; utilisation ignores
        servicing. Known open questions from the issue list, reworded: metric differences from
        history, crew group 70/71 split slightly off, allocation logic under review, cars sent
        when the unavailability data shows no obvious reason, distance not considered when sending
        a car, the share of regular jobs with helicopter benefit, 'conveyed' outcomes for cars,
        servicing intervals with two H145s, forcing winter servicing, and periods of extreme
        unavailability. Close with the technical-team callout linking those issues.
      uses: [assumptions, decision_points, evidence.issues, evidence.markers]
    - page: glossary
      focus: Every plain component name and unavoidable term used on these pages, including the HEMS and statistical terms, with technical names for talking to developers.
      uses: [glossary]
