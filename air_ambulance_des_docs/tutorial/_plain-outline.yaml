plain_summary: |
  This is a computer model of how Devon Air Ambulance's helicopters and critical care cars
  respond to emergency calls. It creates a realistic stream of made-up calls, based on patterns
  in two years of real job records (2023 and 2024), and plays out what would happen under a
  chosen rota, fleet and servicing plan. It is for planners and managers who want to test
  "what if" questions (for example, longer shifts, an extra car or a different aircraft) before
  trying them for real. It produces estimates of missed jobs, how busy each vehicle and crew is,
  and how the results compare with what actually happened, shown in a web app and an optional
  downloadable report.

components:
  - id: streamlit_app
    plain_name: the web app
    plain_role: The screens where a user chooses a scenario (rota, vehicles, servicing, run length), starts the model and views the results.
    technical_name: Streamlit app and scenario parameters (app/app.py, app/setup.py, app/model.py, app/_state_control.py)
  - id: simulation_runner
    plain_name: the run manager
    plain_role: Runs the model many times over (each time with different random chances) and gathers all the runs' results into one file.
    technical_name: des_parallel_process (runSim, parallelProcessJoblib, collateRunResults) (air_ambulance_des/des_parallel_process.py)
  - id: sampling_utils
    plain_name: the pattern sampler
    plain_role: Holds the patterns learned from past jobs (how many calls a day, what type, how long each stage takes) and draws realistic values from them on request.
    technical_name: Utils (air_ambulance_des/utils.py)
  - id: des_hems_model
    plain_name: the call simulator
    plain_role: Creates each day's made-up emergency calls and patients, and moves each one through the stages of a job, writing down every step.
    technical_name: DES_HEMS and Patient (air_ambulance_des/des_hems.py, air_ambulance_des/class_patient.py)
  - id: hems_resources
    plain_name: the fleet and rota model
    plain_role: Represents each helicopter and car, its shift hours in summer and winter, and when it is away for planned servicing.
    technical_name: HEMS, Ambulance and HEMSAvailability servicing methods (air_ambulance_des/class_hems.py, air_ambulance_des/class_ambulance.py, air_ambulance_des/class_hems_availability.py, air_ambulance_des/school_holidays.py)
  - id: resource_allocation
    plain_name: the dispatch rules
    plain_role: Decides which helicopter or car, if any, is sent to each call, and records why.
    technical_name: HEMSAvailability allocation methods and ResourceAllocationReason (air_ambulance_des/class_hems_availability.py)
  - id: trial_results
    plain_name: the results and comparison tool
    plain_role: Turns the recorded steps into headline figures and charts, and sets them beside the real historical figures.
    technical_name: TrialResults, SimulationInputs, HistoricResults (air_ambulance_des/class_simulation_trial_results.py, air_ambulance_des/class_simulation_inputs.py, air_ambulance_des/class_historic_results.py)
  - id: distribution_fitting
    plain_name: the historical data preparer
    plain_role: A separate, occasional step that reads the real job records and turns them into the patterns and historical summaries the model uses.
    technical_name: DistributionFitUtils (air_ambulance_des/distribution_fit_utils.py, run_dist_fit_utils.py)

