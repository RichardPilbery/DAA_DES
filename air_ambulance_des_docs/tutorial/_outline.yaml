project_name: DAA_DES

summary: |
  **DAA_DES** is a *discrete event simulation* of Devon Air Ambulance helicopter emergency medical
  service (HEMS) operations. It is built on **SimPy** and packaged as `air_ambulance_des`, with a
  **Streamlit web app** in `app/` for setting parameters, running the model and viewing results.
  Each simulation run generates daily emergency calls, samples patient characteristics from
  *distributions fitted to historical job data*, tries to allocate a helicopter or car according to
  rotas, servicing schedules and *care category* priorities, and records every step in an
  **event log**. Many seeded **replications** run in parallel, and the combined results are
  summarised and set against **historical data** so that scenarios (different rotas, demand or job
  durations) can be compared with current performance.

abstractions:
  - id: streamlit_app
    name: Streamlit App and Scenario Parameters
    description: |
      The Streamlit multipage app in `app/` is the main user entry point. `app.py` registers the
      pages and calls `setup_state()`, which fills `st.session_state` from `DEFAULT_INPUTS`
      (number of runs, duration, start date, demand multiplier, master seed). The setup page
      accepts an Excel parameter template, a predefined scenario from `scenarios/`, or manual
      edits, and writes each sheet over the matching CSV in `actual_data/` (rota, callsign lookup,
      servicing rules, school holidays, time bounds). `reset_to_defaults()` restores those CSVs from
      their `_DEFAULT` copies. The model page passes session-state values to the run functions,
      then builds result objects and renders tabs of plots and an optional Quarto report.
    files:
      - app/app.py
      - app/_state_control.py
      - app/setup.py
      - app/model.py
      - app/_app_utils.py
      - app/inputs/README.md
    key_symbols:
      - DEFAULT_INPUTS
      - setup_state()
      - reset_to_defaults()
      - input_data_files
      - SETUP_EXCEL
      - SETUP_SCENARIO
      - generate_quarto_report()
      - air_ambulance_des.school_holidays.parse_school_holidays
    tests:
      - tests/test_scenario_importing.py

  - id: simulation_runner
    name: Simulation Runs and Replications
    description: |
      `des_parallel_process` is the package's run API. `runSim()` builds one `DES_HEMS` model for a
      given run number and seed, calls `run()`, and returns that run's results DataFrame; on the
      first run it also calls `write_run_params()` to record the run settings in
      `run_params_used.csv`. `parallelProcessJoblib()` derives one independent seed per replication
      from a master seed with `numpy.random.SeedSequence.spawn` and runs `runSim` across CPU cores
      with joblib. Each run writes `output_run_N.csv`, and `collateRunResults()` merges these into
      `data/run_results.csv`. Durations are in simulated minutes, and a warm-up period can be
      excluded from the results. `run_parallel_process.py` is a command-line equivalent of the
      app's run button.
    files:
      - air_ambulance_des/des_parallel_process.py
      - run_parallel_process.py
      - air_ambulance_des/des_hems.py
    key_symbols:
      - air_ambulance_des.des_parallel_process.runSim
      - air_ambulance_des.des_parallel_process.parallelProcessJoblib
      - air_ambulance_des.des_parallel_process.collateRunResults
      - air_ambulance_des.des_parallel_process.write_run_params
      - air_ambulance_des.des_parallel_process.removeExistingResults
      - air_ambulance_des.des_hems.DES_HEMS.run
      - air_ambulance_des.des_hems.DES_HEMS.write_run_results
      - air_ambulance_des.des_hems.DES_HEMS.write_all_results
    tests:
      - tests/test_unittest_model.py
      - tests/test_reproducibility.py
      - tests/test_backtest.py
      - tests/conftest.py

  - id: sampling_utils
    name: Sampling Distributions and Random Streams
    description: |
      `Utils` loads the fitted inputs from `distribution_data/` (hourly arrival profiles,
      AMPDS-card probabilities, care category, vehicle type, patient outcome and HEMS result
      tables, age and activity-time distributions, daily call-count samples) plus time bounds from
      `actual_data/`. `setup_seeds()` spawns one named `numpy` generator per sampling purpose
      (`rngs["calls_per_day"]`, `rngs["ampds_code_selection"]` and so on) from the run's seed, so
      changing one part of the model does not shift the random numbers used elsewhere.
      `build_seeded_distributions()` wraps each activity-time fit in a `SeededDistribution`.
      Selection methods such as `ampds_code_selection()`, `care_category_selection()`,
      `activity_time()` and `sample_ad_hoc_reason()` return a single sampled value. `Utils` also
      holds folder and file constants.
    files:
      - air_ambulance_des/utils.py
    key_symbols:
      - air_ambulance_des.utils.Utils
      - air_ambulance_des.utils.Utils.setup_seeds
      - air_ambulance_des.utils.Utils.rngs
      - air_ambulance_des.utils.Utils.build_seeded_distributions
      - air_ambulance_des.utils.SeededDistribution
      - air_ambulance_des.utils.Utils.activity_time
      - air_ambulance_des.utils.Utils.inc_per_day_samples
      - air_ambulance_des.utils.Utils.date_time_of_call
      - air_ambulance_des.utils.Utils.sample_ad_hoc_reason
      - air_ambulance_des.utils.Utils.RESULTS_FOLDER
      - air_ambulance_des.utils.Utils.DISTRIBUTION_FOLDER
    tests:
      - tests/test_reproducibility.py
      - tests/test_against_reality.py
      - tests/test_backtest.py
      - tests/test_resource_allocation.py

  - id: des_hems_model
    name: Calls and Patient Journeys
    description: |
      `DES_HEMS` holds the SimPy environment for one run. `generate_calls()` is the arrival
      process: at the start of each simulated day it samples the number of calls (scaled by the
      demand multiplier), spreads them over hours with `calls_per_hour()`, and triggers the daily
      servicing check. Each call becomes a `Patient` in `generate_patient()`, which samples AMPDS
      card, age, sex, care category (CC, EC or REG), patient outcome, helicopter benefit and
      preferred callsign group and vehicle type, then requests a resource. `patient_journey()`
      advances through allocation, mobile, on-scene, to-hospital and clear stages using sampled
      activity times, and returns the resource in a `finally` block. `add_patient_result_row()`
      appends one event-log row per step, skipping rows during the warm-up period.
    files:
      - air_ambulance_des/des_hems.py
      - air_ambulance_des/class_patient.py
    key_symbols:
      - air_ambulance_des.des_hems.DES_HEMS
      - air_ambulance_des.des_hems.DES_HEMS.generate_calls
      - air_ambulance_des.des_hems.DES_HEMS.calls_per_hour
      - air_ambulance_des.des_hems.DES_HEMS.generate_patient
      - air_ambulance_des.des_hems.DES_HEMS.patient_journey
      - air_ambulance_des.des_hems.DES_HEMS.add_patient_result_row
      - air_ambulance_des.class_patient.Patient
      - event_type
      - time_type
    tests:
      - tests/test_call_generation.py
      - tests/test_unittest_model.py
      - tests/test_against_condition_changes.py
      - tests/test_against_reality.py

  - id: hems_resources
    name: HEMS Resources and Servicing
    description: |
      Each helicopter or car is a `HEMS` object, a subclass of the generic `Ambulance` responder,
      with a callsign, callsign group, registration, vehicle type, care category and summer and
      winter shift hours. `hems_resource_on_shift()` checks the rota for a given hour and month,
      and `unavailable_due_to_service()` checks the resource's servicing schedule.
      `HEMSAvailability.prep_HEMS_resources()` reads `HEMS_ROTA.csv`, the callsign/registration
      lookup and servicing rules, and calculates future service dates with
      `find_next_service_date()`, which avoids school holidays and overlaps with other aircraft.
      Resources are held in a SimPy `FilterStore`. `daily_servicing_check()` moves resources
      between the main store and a separate service store, and switches the shared aircraft
      between callsigns H70 and H71.
    files:
      - air_ambulance_des/class_ambulance.py
      - air_ambulance_des/class_hems.py
      - air_ambulance_des/class_hems_availability.py
      - air_ambulance_des/school_holidays.py
    key_symbols:
      - air_ambulance_des.class_ambulance.Ambulance
      - air_ambulance_des.class_hems.HEMS
      - air_ambulance_des.class_hems.HEMS.hems_resource_on_shift
      - air_ambulance_des.class_hems.HEMS.unavailable_due_to_service
      - air_ambulance_des.class_hems.HEMS.service_check
      - air_ambulance_des.class_hems_availability.HEMSAvailability
      - air_ambulance_des.class_hems_availability.HEMSAvailability.prep_HEMS_resources
      - air_ambulance_des.class_hems_availability.HEMSAvailability.populate_store
      - air_ambulance_des.class_hems_availability.HEMSAvailability.daily_servicing_check
      - air_ambulance_des.class_hems_availability.HEMSAvailability.find_next_service_date
      - air_ambulance_des.class_hems_availability.HEMSAvailability.add_hems
      - air_ambulance_des.school_holidays.load_school_holidays
    tests:
      - tests/test_unittest_model.py
      - tests/test_school_holidays.py
      - tests/test_against_condition_changes.py

  - id: resource_allocation
    name: Resource Allocation
    description: |
      `HEMSAvailability` decides which resource, if any, attends each patient. CC and EC patients
      for whom the care need is known go through `allocate_resource()`, which uses
      `preferred_resource_available()` to rank on-shift, unserviced, idle resources by care-category
      and vehicle-type match. Other patients go through `allocate_regular_resource()` and
      `preferred_regular_group_available()`, which use the preferred callsign group, vehicle type
      and helicopter benefit. Helicopters are also tested for ad hoc unavailability, such as
      weather. Both methods return a SimPy event that resolves to a primary resource, a
      `ResourceAllocationReason` text, and an optional secondary resource from the same callsign
      group. Sets of active callsign groups, registrations and callsigns stop a crew or vehicle
      being sent twice. `return_resource()` releases them.
    files:
      - air_ambulance_des/class_hems_availability.py
    key_symbols:
      - air_ambulance_des.class_hems_availability.ResourceAllocationReason
      - air_ambulance_des.class_hems_availability.HEMSAvailability.allocate_resource
      - air_ambulance_des.class_hems_availability.HEMSAvailability.allocate_regular_resource
      - air_ambulance_des.class_hems_availability.HEMSAvailability.preferred_resource_available
      - air_ambulance_des.class_hems_availability.HEMSAvailability.preferred_regular_group_available
      - air_ambulance_des.class_hems_availability.HEMSAvailability.return_resource
      - air_ambulance_des.class_hems_availability.HEMSAvailability.current_store_status
      - air_ambulance_des.class_hems_availability.PROB_HELI_BENEFIT_KNOWN
    tests:
      - tests/test_resource_allocation.py
      - tests/test_unittest_model.py

  - id: trial_results
    name: Trial Results and Historic Comparison
    description: |
      After the runs finish, three classes turn CSV files into metrics and Plotly figures.
      `SimulationInputs` loads the run parameters and the rota, servicing and callsign files used.
      `TrialResults` takes the combined event log (`run_results.csv`) and daily availability data,
      and in its constructor derives job counts, per-run call counts, event durations,
      theoretical available hours and utilisation tables. Its `get_*`, `PLOT_*` and `display_*`
      methods provide missed-job percentages, utilisation summaries and call-pattern plots.
      `HistoricResults` loads the aggregated `historical_data/` files, including a simulated
      baseline using historic rotas, so that the app can show simulated results beside observed
      ones. The `graceful_methods` decorator wraps every method so that an error shows a message
      instead of stopping the app.
    files:
      - air_ambulance_des/class_simulation_trial_results.py
      - air_ambulance_des/class_simulation_inputs.py
      - air_ambulance_des/class_historic_results.py
      - air_ambulance_des/_processing_functions.py
    key_symbols:
      - air_ambulance_des.class_simulation_trial_results.TrialResults
      - air_ambulance_des.class_simulation_trial_results.TrialResults.make_job_count_df
      - air_ambulance_des.class_simulation_trial_results.TrialResults.calculate_available_hours
      - air_ambulance_des.class_simulation_trial_results.TrialResults.get_perc_unattended_string_normalised
      - air_ambulance_des.class_simulation_trial_results.TrialResults.PLOT_SIMULATION_utilisation_summary
      - air_ambulance_des.class_simulation_inputs.SimulationInputs
      - air_ambulance_des.class_historic_results.HistoricResults
      - air_ambulance_des._processing_functions.graceful_methods
    tests: []

  - id: distribution_fitting
    name: Distribution Fitting
    description: |
      `DistributionFitUtils` is an offline pipeline, run through `run_dist_fit_utils.py`, that
      turns a cleaned job-level historical extract into the files the simulation and the results
      pages read. `import_and_wrangle()` adds date and time columns, clears the output folders, and
      calls one method per input: probability tables (for example `hour_by_ampds_card_probs()` and
      `vehicle_type_by_quarter_probs()`), best-fit continuous distributions chosen with `Fitter` in
      `getBestFit()` (activity times, ages), daily call-count samples, and ad hoc unavailability
      rates. These go to `distribution_data/`. The `historical_*` methods write aggregated
      observed totals to `historical_data/`, and `run_sim_on_historical_params()` runs the model with
      historic rotas to produce a baseline for comparison.
    files:
      - air_ambulance_des/distribution_fit_utils.py
      - run_dist_fit_utils.py
    key_symbols:
      - air_ambulance_des.distribution_fit_utils.DistributionFitUtils
      - air_ambulance_des.distribution_fit_utils.DistributionFitUtils.import_and_wrangle
      - air_ambulance_des.distribution_fit_utils.DistributionFitUtils.getBestFit
      - air_ambulance_des.distribution_fit_utils.DistributionFitUtils.activity_time_distributions
      - air_ambulance_des.distribution_fit_utils.DistributionFitUtils.incidents_per_day_samples
      - air_ambulance_des.distribution_fit_utils.DistributionFitUtils.hourly_arrival_by_qtr_probs
      - air_ambulance_des.distribution_fit_utils.DistributionFitUtils.ad_hoc_unavailability
      - air_ambulance_des.distribution_fit_utils.DistributionFitUtils.run_sim_on_historical_params
    tests: []

